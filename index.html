<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Knowledge Vault V10</title>
</head>
<body>

<h1>AI Knowledge Vault V10</h1>

<textarea id="input" style="width:100%;height:150px;"></textarea>

<button onclick="save()">Save</button>
<button onclick="load()">Load</button>

<script>
function save(){
    localStorage.setItem("vault", document.getElementById("input").value);
    alert("Saved to Vault");
}

function load(){
    document.getElementById("input").value =
        localStorage.getItem("vault") || "";
}
</script>

</body>
</html>
