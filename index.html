<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Knowledge Vault</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:white;
    margin:0;
}

header{
    background:#111827;
    padding:15px;
    text-align:center;
    font-size:22px;
}

textarea{
    width:95%;
    height:180px;
    margin:10px;
}

input{
    width:95%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<header>AI Knowledge Vault</header>

<input id="searchBox" placeholder="Search vault">

<textarea id="inputBox"
placeholder="Paste notes, OCR text, legal research, etc..."></textarea>

<br>

<button onclick="saveText()">Save</button>
<button onclick="showVault()">View Vault</button>
<button onclick="searchVault()">Search</button>
<button onclick="exportVault()">Export</button>

<textarea id="outputBox"></textarea>

<script>

function getVault(){
    return JSON.parse(localStorage.getItem("vault") || "[]");
}

function saveVault(v){
    localStorage.setItem("vault", JSON.stringify(v));
}

function saveText(){

    let vault = getVault();

    vault.push({
        date:new Date().toISOString(),
        text:document.getElementById("inputBox").value
    });

    saveVault(vault);

    alert("Saved");
}

function showVault(){

    let vault = getVault();

    document.getElementById("outputBox").value =
        vault.map(x=>x.text).join("\n\n==========\n\n");
}

function searchVault(){

    let q =
        document.getElementById("searchBox")
        .value.toLowerCase();

    let vault = getVault();

    let results =
        vault.filter(x =>
            x.text.toLowerCase().includes(q)
        );

    document.getElementById("outputBox").value =
        results.map(x=>x.text)
        .join("\n\n==========\n\n");
}

function exportVault(){

    let vault = getVault();

    let blob = new Blob(
        [JSON.stringify(vault,null,2)],
        {type:"application/json"}
    );

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="vault.json";

    a.click();
}

</script>

</body>
</html>
